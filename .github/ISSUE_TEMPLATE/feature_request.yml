name: Feature request
description: Suggest an idea, such as another streaming service, a filter or a sort
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Flixdex to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
